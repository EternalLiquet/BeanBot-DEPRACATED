name: Intentional BeanBot Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without the leading v (for example, 2.18.0 or 2.17.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beanbot-release
  cancel-in-progress: false

jobs:
  verify-and-publish-image:
    name: Verify and publish immutable image
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-name: ${{ steps.selected-image.outputs.image-name }}
      image-digest: ${{ steps.selected-image.outputs.image-digest }}
      release-version: ${{ steps.selected-image.outputs.release-version }}

    steps:
      - name: Check out exact master commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate release identity
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be stable SemVer in MAJOR.MINOR.PATCH form." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo "Release workflow must run from the exact current master head." >&2
            exit 1
          fi
          if tag_commit="$(git rev-parse --verify --quiet "refs/tags/v$RELEASE_VERSION^{commit}")"; then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Release tag v$RELEASE_VERSION already targets a different commit." >&2
              exit 1
            fi
          fi
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$image_name" >>"$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect existing GitHub release transaction
        id: existing-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/release-assets.sh inspect \
            "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$GITHUB_SHA" \
            "$IMAGE_NAME" "$GITHUB_OUTPUT"

      - name: Inspect existing image transaction
        id: existing-image
        env:
          RELEASE_DIGEST: ${{ steps.existing-release.outputs.release-digest }}
        run: |
          ./scripts/release-image.sh inspect \
            "$IMAGE_NAME" "$GITHUB_SHA" "$RELEASE_VERSION" "$GITHUB_OUTPUT" \
            "$RELEASE_DIGEST"

      - name: Full release-quality verification
        run: |
          BEANBOT_VERIFY_DOCKER_TAG="$IMAGE_NAME:$GITHUB_SHA" \
          BEANBOT_BUILD_VERSION="$RELEASE_VERSION" \
          BEANBOT_BUILD_COMMIT_SHA="$GITHUB_SHA" \
            ./scripts/verify.sh full

      - name: Stage verified image candidate
        if: steps.existing-image.outputs.reuse != 'true'
        id: staged-image
        run: |
          ./scripts/release-image.sh stage \
            "$IMAGE_NAME" "$GITHUB_SHA" "$RELEASE_VERSION" "$GITHUB_OUTPUT" \
            "$IMAGE_NAME:$GITHUB_SHA"

      - name: Select release image identity
        id: selected-image
        env:
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.image-digest }}
          STAGED_DIGEST: ${{ steps.staged-image.outputs.image-digest }}
        run: |
          ./scripts/select-release-image.sh \
            "$IMAGE_NAME" "$EXISTING_DIGEST" "$STAGED_DIGEST" \
            "$RELEASE_VERSION" "$GITHUB_OUTPUT"
          mkdir -p .artifacts/release

      - name: Generate build provenance
        if: steps.selected-image.outputs.provenance-action == 'generate'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.selected-image.outputs.image-name }}
          subject-digest: ${{ steps.selected-image.outputs.image-digest }}
          push-to-registry: true

      - name: Verify existing build provenance
        if: steps.selected-image.outputs.provenance-action == 'verify'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.selected-image.outputs.image-digest }}
        run: |
          ./scripts/verify-release-provenance.sh \
            "$IMAGE_NAME" "$IMAGE_DIGEST" "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" "refs/heads/master"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.selected-image.outputs.image-name }}@${{ steps.selected-image.outputs.image-digest }}
          format: spdx-json
          output-file: .artifacts/release/beanbot.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ steps.selected-image.outputs.image-name }}
          subject-digest: ${{ steps.selected-image.outputs.image-digest }}
          sbom-path: .artifacts/release/beanbot.spdx.json
          push-to-registry: true

      - name: Create release metadata and checksums
        run: |
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg commitSha "$GITHUB_SHA" \
            --arg image "$IMAGE_NAME" \
            --arg digest "${{ steps.selected-image.outputs.image-digest }}" \
            '{version:$version,commitSha:$commitSha,image:$image,digest:$digest}' \
            >.artifacts/release/release-metadata.json
          ./scripts/create-release-checksums.sh

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}
          path: |
            .artifacts/release
            .artifacts/coverage
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Promote immutable image tags
        run: |
          ./scripts/release-image.sh promote \
            "$IMAGE_NAME" "$GITHUB_SHA" "$RELEASE_VERSION" \
            "${{ steps.selected-image.outputs.image-digest }}"

  create-github-release:
    name: Create GitHub Release
    needs: verify-and-publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence-${{ github.run_id }}
          path: release-evidence

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.verify-and-publish-image.outputs.release-version }}
          IMAGE_NAME: ${{ needs.verify-and-publish-image.outputs.image-name }}
          IMAGE_DIGEST: ${{ needs.verify-and-publish-image.outputs.image-digest }}
        run: |
          ./scripts/release-assets.sh publish \
            "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$GITHUB_SHA" \
            release-evidence/release "$IMAGE_NAME" "$IMAGE_DIGEST"
