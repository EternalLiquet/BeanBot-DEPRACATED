name: Regenerate lock files (temporary)

on:
  push:
    branches:
      - fix/develop-lock-integrity-20260821

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Regenerate committed NuGet lock files
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore BeanBot.sln --force-evaluate
          git add BeanBot/packages.lock.json BeanBot.Tests/packages.lock.json

          if git diff --cached --quiet; then
            echo "Lock files were already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: regenerate NuGet lock files"
          git push origin HEAD:${GITHUB_REF_NAME}
