name: .NET Core Master and Deploy Checks

on:
  push:
    branches:
      - master
      - deploy
  pull_request:
    branches:
      - master
      - deploy
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Full repository verification
        run: ./scripts/verify.sh full
