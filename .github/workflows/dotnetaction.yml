name: Repository Verification

on:
  push:
    branches:
      - develop
      - master
      - deploy
  pull_request:
    branches:
      - develop
      - master
      - deploy
  release:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Full repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Build the merge result, but prove branch ancestry against the real PR head.
      BEANBOT_BRANCH_INTEGRITY_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      BEANBOT_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      BEANBOT_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Full repository verification
        run: ./scripts/verify.sh full

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: .artifacts/coverage
          if-no-files-found: ignore
          retention-days: 14
